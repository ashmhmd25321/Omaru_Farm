services:
  db:
    image: mysql:8.4
    container_name: omaru_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-omaru_farm}
      MYSQL_USER: ${DB_USER:-omaru}
      MYSQL_PASSWORD: ${DB_PASSWORD:-omaru_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    # Do not publish DB to the host in production. Uncomment only for local debugging:
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - omaru_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: omaru_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-omaru}
      DB_PASSWORD: ${DB_PASSWORD:-omaru_password}
      DB_NAME: ${DB_NAME:-omaru_farm}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?CUSTOMER_JWT_SECRET must be set}
      ADMIN_JWT_EXPIRES: ${ADMIN_JWT_EXPIRES:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_LOGIN_WINDOW_MS: ${ADMIN_LOGIN_WINDOW_MS:-600000}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-8}
      UPLOAD_DIR: /app/uploads
      FEATURE_CHECKOUT: ${FEATURE_CHECKOUT:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-aud}
      AUSPOST_ENABLED: ${AUSPOST_ENABLED:-true}
      AUSPOST_PAC_API_KEY: ${AUSPOST_PAC_API_KEY:-}
      AUSPOST_ORIGIN_POSTCODE: ${AUSPOST_ORIGIN_POSTCODE:-3922}
      AUSPOST_PREFERRED_SERVICE: ${AUSPOST_PREFERRED_SERVICE:-AUS_PARCEL_REGULAR}
      AUSPOST_FALLBACK_TO_MATRIX: ${AUSPOST_FALLBACK_TO_MATRIX:-false}
      AUSPOST_DEFAULT_LENGTH_CM: ${AUSPOST_DEFAULT_LENGTH_CM:-20}
      AUSPOST_DEFAULT_WIDTH_CM: ${AUSPOST_DEFAULT_WIDTH_CM:-15}
      AUSPOST_DEFAULT_HEIGHT_CM: ${AUSPOST_DEFAULT_HEIGHT_CM:-10}
      SHIPPING_DATA_PROVISIONAL: ${SHIPPING_DATA_PROVISIONAL:-false}
      SHIPPING_FREE_OVER: ${SHIPPING_FREE_OVER:-}
      FARM_TIMEZONE: ${FARM_TIMEZONE:-Australia/Melbourne}
      PENDING_PAYMENT_TTL_MS: ${PENDING_PAYMENT_TTL_MS:-1800000}
    volumes:
      - uploads_data:/app/uploads
    # API is reached via frontend nginx proxy only — do not publish 4000 publicly.
    expose:
      - "4000"
    networks:
      - omaru_internal

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin relative /api/* paths (host Nginx proxies to backend)
        VITE_API_BASE_URL: ""
    container_name: omaru_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - uploads_data:/app/uploads:ro
    ports:
      - "5173:80"
    networks:
      - omaru_internal

volumes:
  db_data:
  uploads_data:

networks:
  omaru_internal:
    driver: bridge
